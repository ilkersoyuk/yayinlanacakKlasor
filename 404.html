<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kelime Ezber" />
    <title>Kelime Ezber Pro • YDS & YÖKDİL</title>
    <base href="/yayinlanacakKlasor/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="KelimeEzberApp.styles.css" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #fff; font-family: sans-serif;">
            <div style="font-size: 42px; margin-bottom: 12px;">📚</div>
            <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px;">Kelime Ezber Pro</h2>
            <p style="font-size: 12px; opacity: 0.7; margin-bottom: 24px;">YDS & YÖKDİL Hazırlık</p>
            <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <style>
                @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            </style>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none; position: fixed; bottom: 0; left: 0; right: 0; background: #fee2e2; color: #991b1b; padding: 10px; font-size: 12px; text-align: center; z-index: 10000;">
        Beklenmeyen bir hata oluştu.
        <a href="" style="font-weight: bold; margin-left: 6px; color: #991b1b;">Yenile</a>
    </div>

    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            }).then(function () {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>
</body>

</html>
